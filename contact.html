<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <h2>JobBoard</h2>
    <div>
      <a href="index.html">Home</a>
      <a href="jobs.html">Jobs</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <div class="ds-container">
    <h1 class="ds-title">Seek Guidance</h1>

    <p class="ds-subtitle">
      The path is unclear... but you may leave a message.
    </p>

    <form class="ds-form">
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Your Email" required>
      <textarea placeholder="Your Message..." required></textarea>

      <button type="submit">Send Signal</button>
    </form>

    <p id="ds-response" class="ds-response hidden">
      Your message has been heard... whether it answers back is another matter.
    </p>
  </div>

  <script src="contact.js"></script>
</body>
</html>
